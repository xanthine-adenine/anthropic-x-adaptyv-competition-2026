[project]
name = "anthropic-x-adaptyv-challenge-4"
version = "0.1.0"
description = "Generate entries for the Anthropic x Adaptyv competition challenge 4"
requires-python = "==3.12.12"
dependencies = [
    "biopython>=1.88",
    "gemmi>=0.7.5",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "modal>=1.3.2",
    "numpy>=2.4.2",
    "pandas>=3.0.1",
    "requests>=2.32.5",
    "ruff>=0.15.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
